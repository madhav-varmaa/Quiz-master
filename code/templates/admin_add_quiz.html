<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Quiz - Quiz Master</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Add New Quiz</h2>

        <form method="POST">

            <div class="mb-3">
                <label for="chapter_id" class="form-label">Chapter</label>
                <select name="chapter_id" class="form-control" required>
                    {% for chapter in chapters %}
                    <option value="{{ chapter.id }}">{{ chapter.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="date_of_quiz" class="form-label">Quiz Date & Time</label>
                <input type="datetime-local" name="date_of_quiz" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="duration" class="form-label">Duration (HH:MM)</label>
                <input type="text" name="duration" class="form-control" placeholder="00:30" required>
            </div>

            <button type="submit" class="btn btn-primary">Create Quiz</button>
            
        </form>
    </div>
</body>
</html>
