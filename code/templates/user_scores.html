<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scores - Quiz Master</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">
            <a class="navbar-brand" href="#">Quiz Master</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="{{ url_for('user_dashboard')}}">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">My Scores</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>

        </div>

    </nav>

    <div class="container mt-4">
        <h2>My Scores</h2>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Quiz ID</th>
                    <th>Chapter Name</th>
                    <th>Total Questions</th>
                    <th>Score</th>
                </tr>

            </thead>

            <tbody>

                {% for score in scores %}
                <tr>
                    <td>{{ score.quiz_id }}</td>
                    <td>{{ score.quiz.chapter.name }}</td>
                    <td>{{ score.quiz.total_questions }}</td>
                    <td>{{ score.total_scored }}</td>
                </tr>
                {% endfor %}
                
            </tbody>
        </table>
    </div>
</body>
</html>
