<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attempt Quiz - Quiz Master</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>{{ quiz.chapter.name }}</h2>

        <form method="POST" action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}" id="quizForm">

            {% for question in questions %}

            <div class="card mb-3">
                <div class="card-body">
                    <p><strong>{{ question.question_statement }}</strong></p>

                    {% for i in range(1, 5) %}

                    <div class="form-check">
                        <input type="radio" name="question_{{ question.id }}" value="{{ i }}" class="form-check-input" required>
                        <label class="form-check-label">{{ question['option' + i|string] }}</label>
                    </div>

                    {% endfor %}
                </div>
                
            </div>

            {% endfor %}
            <button type="submit" class="btn btn-success">Submit</button>
        </form>
    </div>
</body>
</html>
